name: JP egress probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Compare direct and JP-proxied announcements
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: resource-jp
    env:
      JP_VERSION_SUBSCRIPTION: ${{ secrets.JP_VERSION_SUBSCRIPTION }}
    steps:
      - uses: actions/checkout@v7
      - name: Probe direct announcement service
        shell: bash
        run: |
          printf '\x00\x00\x00\x00\x00' > "$RUNNER_TEMP/frame"
          code=$(curl --silent --show-error --http2-prior-knowledge --max-time 25 \
            --output /dev/null --write-out '%{http_code}' \
            -H 'content-type: application/grpc' -H 'te: trailers' -H 'x-platform: Android' \
            -A 'grpc-dotnet/2.66.0' --data-binary "@$RUNNER_TEMP/frame" \
            https://api.bang-dream-on.jp/app.announcement.AnnouncementService/GetList)
          echo "Direct announcement service: HTTP $code"
      - name: Start JP API egress
        if: env.JP_VERSION_SUBSCRIPTION != ''
        uses: ./.github/actions/setup-jp-api-egress
        with:
          subscription_url: ${{ env.JP_VERSION_SUBSCRIPTION }}
      - name: Probe JP-proxied announcement service
        if: env.JP_VERSION_PROXY != ''
        shell: bash
        run: |
          code=$(curl --silent --show-error --http2-prior-knowledge --max-time 25 \
            --proxy "$JP_VERSION_PROXY" --output /dev/null --write-out '%{http_code}' \
            -H 'content-type: application/grpc' -H 'te: trailers' -H 'x-platform: Android' \
            -A 'grpc-dotnet/2.66.0' --data-binary "@$RUNNER_TEMP/frame" \
            https://api.bang-dream-on.jp/app.announcement.AnnouncementService/GetList)
          echo "JP-proxied announcement service: HTTP $code"
          test "$code" = 200
