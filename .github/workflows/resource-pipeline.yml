name: Resource pipeline

on:
  schedule:
    # 04:05, 12:05, 20:05 Asia/Tokyo (UTC+9) for jp and intl.
    - cron: "5 3 * * *"
    - cron: "5 11 * * *"
    - cron: "5 19 * * *"
  workflow_dispatch:
    inputs:
      server:
        description: Server configuration id ("all" runs JP and Intl together)
        required: true
        default: intl
        type: choice
        options:
          - intl
          - jp
          - jp-cbt
          - intl-cbt
          - all
      github_environment:
        description: GitHub Actions environment for the run
        required: false
        default: ""
        type: string
      package_r2_key:
        description: Private R2 CAS key of one APK, APKS, or XAPK file
        required: false
        type: string
      source_id:
        description: Existing immutable R2 source id to resume without ingestion
        required: false
        type: string
      ktx2:
        description: Package original runtime texture blocks
        required: false
        default: true
        type: boolean
      basis_reencode:
        description: Lossy runtime-only Basis opt-in; preserve canonical PNGs
        required: false
        default: false
        type: boolean
      force:
        description: Rebuild even when the source identity is unchanged
        required: false
        default: false
        type: boolean
      no_reuse:
        description: Disable cross-source and cross-build artifact reuse
        required: false
        default: false
        type: boolean
concurrency:
  group: resource-pipeline-${{ github.event_name == 'schedule' && 'production-daily' || inputs.server }}
  cancel-in-progress: false

jobs:
  pipeline_intl:
    name: Build and publish Intl resources
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.server == 'intl' || inputs.server == 'all')) }}
    permissions:
      contents: read
    uses: ./.github/workflows/resource-pipeline-run.yml
    with:
      github_environment: ${{ github.event_name == 'schedule' && 'resource-intl' || inputs.github_environment || 'resource-intl' }}
      server: intl
      package_r2_key: ${{ inputs.package_r2_key }}
      source_id: ${{ inputs.source_id }}
      # On schedule events the inputs context is empty, which would feed ''
      # into boolean-typed callee inputs and fail input validation.
      ktx2: ${{ github.event_name == 'schedule' || inputs.ktx2 || false }}
      basis_reencode: ${{ inputs.basis_reencode || false }}
      force: ${{ inputs.force || false }}
      no_reuse: ${{ inputs.no_reuse || false }}
    secrets:
      cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
      r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      resource_cdn_authorization: ${{ secrets.RESOURCE_CDN_AUTHORIZATION }}
      secret_writer_gh_token: ${{ secrets.SECRET_WRITER_GH_TOKEN }}
      jp_version_subscription: ${{ secrets.JP_VERSION_SUBSCRIPTION }}

  pipeline_jp:
    name: Build and publish JP resources
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.server == 'jp' || inputs.server == 'all')) }}
    permissions:
      contents: read
    uses: ./.github/workflows/resource-pipeline-run.yml
    with:
      github_environment: ${{ github.event_name == 'schedule' && 'resource-jp' || inputs.github_environment || 'resource-jp' }}
      server: jp
      package_r2_key: ${{ inputs.package_r2_key }}
      source_id: ${{ inputs.source_id }}
      ktx2: ${{ github.event_name == 'schedule' || inputs.ktx2 || false }}
      basis_reencode: ${{ inputs.basis_reencode || false }}
      force: ${{ inputs.force || false }}
      no_reuse: ${{ inputs.no_reuse || false }}
    secrets:
      cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
      r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      resource_cdn_authorization: ${{ secrets.RESOURCE_CDN_AUTHORIZATION }}
      secret_writer_gh_token: ${{ secrets.SECRET_WRITER_GH_TOKEN }}
      jp_version_subscription: ${{ secrets.JP_VERSION_SUBSCRIPTION }}

  pipeline_manual:
    name: Build and publish manually selected resources
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.server != 'intl' && inputs.server != 'jp' && inputs.server != 'all' }}
    permissions:
      contents: read
    uses: ./.github/workflows/resource-pipeline-run.yml
    with:
      github_environment: ${{ inputs.github_environment || format('resource-{0}', inputs.server) }}
      server: ${{ inputs.server }}
      package_r2_key: ${{ inputs.package_r2_key }}
      source_id: ${{ inputs.source_id }}
      ktx2: ${{ inputs.ktx2 || false }}
      basis_reencode: ${{ inputs.basis_reencode || false }}
      force: ${{ inputs.force || false }}
      no_reuse: ${{ inputs.no_reuse || false }}
    secrets:
      cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
      r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      resource_cdn_authorization: ${{ secrets.RESOURCE_CDN_AUTHORIZATION }}
      secret_writer_gh_token: ${{ secrets.SECRET_WRITER_GH_TOKEN }}
      jp_version_subscription: ${{ secrets.JP_VERSION_SUBSCRIPTION }}

  rebuild-site:
    name: Rebuild site pages
    needs: [pipeline_intl, pipeline_jp]
    # Rebuild once after either production server promotes an immutable release.
    if: ${{ always() && (needs.pipeline_intl.outputs.release_promoted == 'true' || needs.pipeline_jp.outputs.release_promoted == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch site build after the release is published
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cloudflare.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Rebuild Sonolus presentation from promoted Intl resources
        if: ${{ vars.ENABLE_SONOLUS_PUBLICATION == 'true' && needs.pipeline_intl.outputs.release_promoted == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sonolus.yml --repo "$GITHUB_REPOSITORY" --ref main
