name: Build complete static frontend
on:
  workflow_call:
    inputs:
      page_groups:
        type: string
        default: core
      resource_servers:
        type: string
        default: intl,jp
    outputs:
      frontend_artifact:
        value: ${{ jobs.merge.outputs.artifact }}
      inputs_artifact:
        value: ${{ jobs.prepare.outputs.artifact }}
      inputs_sha:
        value: ${{ jobs.prepare.outputs.inputs_sha }}
      node_version:
        value: ${{ jobs.prepare.outputs.node_version }}
jobs:
  prepare:
    name: Freeze shared static inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=5120
      STATIC_PAGE_GROUPS: ${{ inputs.page_groups }}
      STATIC_RESOURCE_SERVERS: ${{ inputs.resource_servers }}
      STATIC_CATALOG_SOURCE: http
      STATIC_BUILD_INPUT_MODE: capture
      STATIC_BUILD_INPUT_ROOT: data/static-build/inputs
      PROVIDER_STATIC_SNAPSHOT: data/provider-static/snapshots/${{ github.run_id }}
      ASTRO_TELEMETRY_DISABLED: "1"
    outputs:
      inputs_sha: ${{ steps.freeze.outputs.inputs_sha }}
      artifact: ${{ steps.freeze.outputs.artifact }}
      node_version: ${{ steps.node.outputs.node-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
        id: node
      - run: node scripts/external-repositories.mjs checkout
      - name: Restore locked WASM CLI
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen*
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: wasm-bindgen-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.dependencies/vega/Cargo.lock') }}
      - uses: ./.dependencies/vega/.github/actions/setup-wasm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dependencies:verify
      - uses: ./.github/actions/setup-cubism-runtime
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
      - name: Resolve current catalog cache identities
        id: catalog-identity
        run: echo "key=$(node scripts/build/static-build-inputs.mjs catalog-cache-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: catalog-cache
        with:
          path: |
            data/static-catalog/v1
            data/static-catalog/blobs/v1
          key: static-catalog-current-v2-${{ runner.os }}-${{ steps.catalog-identity.outputs.key }}
          restore-keys: static-catalog-current-v2-${{ runner.os }}-
      - uses: actions/cache/restore@v6
        id: embed-cache
        with:
          path: public/embed
          key: embed-compat-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: embed-compat-v1-${{ runner.os }}-
      - uses: actions/cache/restore@v6
        id: cubism-cache
        with:
          path: data/static-catalog/cubism-model-metadata/v1
          key: cubism-model-metadata-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cubism-model-metadata-v1-${{ runner.os }}-
      - uses: actions/cache/restore@v6
        id: render-cache
        with:
          path: data/static-render/model-v1
          key: model-render-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: model-render-v1-${{ runner.os }}-
      - uses: actions/cache/restore@v6
        id: provider-http-cache
        with:
          path: data/provider-static/http-cache
          key: provider-http-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: provider-http-v1-${{ runner.os }}-
      - uses: actions/cache/restore@v6
        id: provider-snapshot-cache
        with:
          path: |
            data/provider-static/snapshots
            data/provider-static/entities/payloads
            data/provider-static/entities/receipts
          key: provider-snapshot-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: provider-snapshot-v1-${{ runner.os }}-${{ github.run_id }}-
      - name: Resolve compiled package source and toolchain identity
        id: package-identity
        run: echo "key=$(node scripts/build/package-build-cache.mjs key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: package-cache
        with:
          path: |
            .output/compiled-packages/manifest.json
            packages/*/dist
            packages/*/src/generated
            .dependencies/*/dist
            .dependencies/*/src/generated
            .dependencies/*/packages/*/dist
            .dependencies/*/packages/*/src/generated
          key: compiled-frontend-v1-${{ runner.os }}-${{ steps.package-identity.outputs.key }}
      - name: Verify or build shared packages
        run: |
          if ! node scripts/build/package-build-cache.mjs verify; then
            pnpm build:packages
            node scripts/build/package-build-cache.mjs record
          fi
      - uses: actions/cache/save@v6
        if: steps.package-cache.outputs.cache-hit != 'true'
        with:
          path: |
            .output/compiled-packages/manifest.json
            packages/*/dist
            packages/*/src/generated
            .dependencies/*/dist
            .dependencies/*/src/generated
            .dependencies/*/packages/*/dist
            .dependencies/*/packages/*/src/generated
          key: compiled-frontend-v1-${{ runner.os }}-${{ steps.package-identity.outputs.key }}
      - name: Build public assets once
        run: |
          pnpm prepare:frontend
          pnpm build:embeds
          pnpm build:provider-static
      - name: Collect all production data and route matrices
        run: |
          node scripts/build/prepare-static-inputs.mjs
          STATIC_BUILD_PHASE=prepare pnpm exec astro build
          node scripts/build/static-build-inputs.mjs compact-catalog-cache --root "$PWD" --capture "$STATIC_BUILD_INPUT_ROOT"
      - name: Verify and freeze complete shared inputs
        id: freeze
        run: |
          node scripts/build/static-build-inputs.mjs freeze --root "$PWD" --capture "$STATIC_BUILD_INPUT_ROOT" --output .output/static-frozen-inputs > .output/static-freeze-result.json
          node scripts/build/static-build-shards.mjs plan --root "$PWD" --inputs .output/static-frozen-inputs/manifest.json --routes "$STATIC_BUILD_INPUT_ROOT/route-plan" --output .output/static-shard-plan.json
          node --input-type=module -e 'import fs from "node:fs";const result=JSON.parse(fs.readFileSync(".output/static-freeze-result.json"));fs.appendFileSync(process.env.GITHUB_OUTPUT,`inputs_sha=${result.sha256}\nartifact=static-inputs-${process.env.GITHUB_SHA}-${process.env.GITHUB_RUN_ID}-${result.sha256}\n`);'
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.freeze.outputs.artifact }}
          path: |
            .output/static-frozen-inputs
            .output/static-shard-plan.json
          include-hidden-files: true
          compression-level: 6
          retention-days: 7
          if-no-files-found: error
      - uses: actions/cache/save@v6
        if: always() && steps.catalog-cache.outputs.cache-primary-key != '' && steps.catalog-cache.outputs.cache-hit != 'true'
        with:
          path: |
            data/static-catalog/v1
            data/static-catalog/blobs/v1
          key: ${{ steps.catalog-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@v6
        if: always() && steps.embed-cache.outputs.cache-primary-key != '' && steps.embed-cache.outputs.cache-hit != 'true'
        with:
          path: public/embed
          key: ${{ steps.embed-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@v6
        if: always() && steps.cubism-cache.outputs.cache-primary-key != '' && steps.cubism-cache.outputs.cache-hit != 'true'
        with:
          path: data/static-catalog/cubism-model-metadata/v1
          key: ${{ steps.cubism-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@v6
        if: always() && steps.render-cache.outputs.cache-primary-key != '' && steps.render-cache.outputs.cache-hit != 'true'
        with:
          path: data/static-render/model-v1
          key: ${{ steps.render-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@v6
        if:
          always() && steps.provider-http-cache.outputs.cache-primary-key != '' && steps.provider-http-cache.outputs.cache-hit
          != 'true'
        with:
          path: data/provider-static/http-cache
          key: ${{ steps.provider-http-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@v6
        if: always() && steps.provider-snapshot-cache.outputs.cache-primary-key != '' &&
          steps.provider-snapshot-cache.outputs.cache-hit != 'true'
        with:
          path: |
            data/provider-static/snapshots
            data/provider-static/entities/payloads
            data/provider-static/entities/receipts
          key: ${{ steps.provider-snapshot-cache.outputs.cache-primary-key }}
  locale:
    name: Complete ${{ matrix.locale }} frontend
    needs: prepare
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        locale:
          - en
          - ja
          - ko
          - zh-CN
          - zh-TW
    uses: ./.github/workflows/static-locale.yml
    with:
      locale: ${{ matrix.locale }}
      inputs_artifact: ${{ needs.prepare.outputs.artifact }}
      inputs_sha: ${{ needs.prepare.outputs.inputs_sha }}
      node_version: ${{ needs.prepare.outputs.node_version }}
      page_groups: ${{ inputs.page_groups }}
      resource_servers: ${{ inputs.resource_servers }}

  merge:
    name: Verify and merge complete frontend
    needs:
      - prepare
      - locale
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=5120
      STATIC_PAGE_GROUPS: ${{ inputs.page_groups }}
      STATIC_RESOURCE_SERVERS: ${{ inputs.resource_servers }}
      STATIC_CATALOG_SOURCE: http
    outputs:
      artifact: ${{ steps.archive.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ needs.prepare.outputs.node_version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: node scripts/external-repositories.mjs checkout
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: .output
      - run:
          node scripts/build/static-build-inputs.mjs restore --manifest .output/static-frozen-inputs/manifest.json --root
          "$PWD" --source-root "$PWD"
      - uses: actions/download-artifact@v8
        with:
          pattern: static-part-${{ needs.prepare.outputs.inputs_sha }}-*
          path: .output/static-parts
      - name: Verify every document, common asset and search language
        run: |
          for locale in en ja ko zh-CN zh-TW; do
            mv ".output/static-parts/static-part-${{ needs.prepare.outputs.inputs_sha }}-${locale}" ".output/static-parts/${locale}"
          done
          node scripts/build/static-build-shards.mjs merge --plan .output/static-shard-plan.json --parts .output/static-parts --inputs .output/static-frozen-inputs/manifest.json --output .output/static-merged
          cp -a .output/static-merged/.output/. .output/
          pnpm runtime:cubism:verify-output
          for entry in core vega cassiopeia home-spot vega-theme api-client; do
            test -s ".output/public/embed/${entry}.js"
          done
          test -s .output/public/embed/manifest.json
      - name: Verify complete immutable asset documents
        run: node scripts/build/publish-static-documents.mjs
      - name: Check resource pipeline
        run: python3 -m unittest discover -s scripts/garupa_master/tests -t .
      - name: Check Worker types
        run: pnpm typecheck:worker
      - name: Prepare verified Worker publication
        run: node scripts/deploy/worker-publication.mjs prepare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Archive complete qualified publication
        id: archive
        run: |
          tar --use-compress-program="zstd -T2 -3" -cf .output/worker-publication.tar.zst .output/deployment .output/public .output/static-documents/publication.json .output/static-documents/references.json
          echo "artifact=worker-publication-${{ github.sha }}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive.outputs.artifact }}
          path: .output/worker-publication.tar.zst
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
