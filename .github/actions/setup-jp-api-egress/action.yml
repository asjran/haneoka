name: JP API egress
description: Start the selected Japanese exit for JP API requests
inputs:
  subscription_url:
    description: Japanese proxy subscription URL
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SUBSCRIPTION_URL: ${{ inputs.subscription_url }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/jp-proxy"
        mkdir -p "$dir/providers"
        curl --fail --location --retry 3 --max-time 60 \
          -A "clash.meta/1.19.0" \
          -o "$dir/providers/sub.yaml" \
          "$SUBSCRIPTION_URL"
        cat > "$dir/config.yaml" <<'YAML'
        mixed-port: 7899
        mode: rule
        log-level: warning
        ipv6: false
        proxy-providers:
          sub:
            type: file
            path: ./providers/sub.yaml
            health-check:
              enable: false
        proxy-groups:
          - name: JP-EGRESS
            type: select
            use: [sub]
            filter: "JP"
            exclude-filter: "(?i)\\[v6\\]"
        rules:
          - MATCH,JP-EGRESS
        YAML
        curl --fail --location --retry 3 --max-time 180 \
          -o "$RUNNER_TEMP/mihomo.gz" \
          "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.31/mihomo-linux-amd64-v1-v1.19.31.gz"
        echo "d4304c546c3cddcb6fafd4b4fddb0ba1a95ffa36606fda56d75db2e59ad24114  $RUNNER_TEMP/mihomo.gz" | sha256sum -c -
        gunzip -c "$RUNNER_TEMP/mihomo.gz" > "$RUNNER_TEMP/mihomo"
        chmod +x "$RUNNER_TEMP/mihomo"
        nohup "$RUNNER_TEMP/mihomo" -d "$dir" > "$dir/mihomo.log" 2>&1 &
        for attempt in $(seq 1 30); do
          if curl -sS --max-time 5 -x http://127.0.0.1:7899 -o /dev/null \
              "https://www.gstatic.com/generate_204"; then
            echo "JP API egress proxy ready (attempt $attempt)"
            echo "JP_VERSION_PROXY=http://127.0.0.1:7899" >> "$GITHUB_ENV"
            exit 0
          fi
          sleep 2
        done
        echo "JP API egress proxy failed to become ready" >&2
        cat "$dir/mihomo.log" >&2 || true
        exit 1
